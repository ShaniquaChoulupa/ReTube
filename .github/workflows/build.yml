name: Build ReTube
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools (xxd, protoc 31.1 to match bundled protobuf runtime)
        run: |
          sudo apt-get update && sudo apt-get install -y xxd unzip
          curl -sSL -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          sudo unzip -o protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version
      - name: Fetch zip library (git submodule missing from upload)
        run: |
          if [ ! -f lib/zip/src/zip.c ]; then
            rm -rf lib/zip && git clone --depth 1 https://github.com/kuba--/zip lib/zip
          fi
      - name: Make protobuf output folder
        run: mkdir -p common/SABR/proto/generated
      - uses: Randomblock1/theos-action@v1
      - name: Build
        run: make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: ReTube
          path: packages/*.deb
